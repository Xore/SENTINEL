# Planned central configuration. The dashboard does not load this file yet.
# Copy to /etc/network-probe/probe.toml only after reviewing every value.

[probe]
site = "example-site"
timezone = "UTC"
management_bind = "127.0.0.1:8088"

[capture]
interface = "CHANGE_ME"
directory = "/var/lib/network-probe/captures"
seconds_per_file = 300
file_count = 24
max_mib_per_file = 512
reserve_free_gib = 20

[safety]
active_checks_enabled = false
ot_concurrency = 1
it_concurrency = 4
jitter_percent = 15
failure_backoff_seconds = 300
minimum_target_interval_seconds = 60

[thresholds]
capture_drop_delta_warning = 1
disk_used_percent_warning = 80
disk_used_percent_stop_capture = 90
tcp_failure_count_alert = 3
route_change_alert = true

[features]
ntopng = false
zeek = false
suricata = false
snmpv3 = false
opcua_readonly = false
s7_readonly = false
prometheus_export = false
