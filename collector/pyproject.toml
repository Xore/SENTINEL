[project]
name = "analyselaptop-collector"
version = "2.0.0-dev"
description = "SENTINEL v2 network collector agent (asyncio, OTLP/gRPC, mTLS)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "See repository LICENSE" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["collector*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Sensible default set; expand as the codebase grows.
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pylint.main]
# Run from the collector/ directory; both the package and tests are discovered.
jobs = 1
recursive = true

[tool.pylint."messages control"]
disable = [
    # Docstrings are enforced gradually — not required for every method yet.
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    # Pydantic models and dataclasses routinely have few public methods.
    "too-few-public-methods",
    # import-error: pylint can't resolve optional deps (bcc, scapy) that are
    # guarded by try/except at runtime.
    "import-error",
    # fixme: TODO/FIXME comments are intentional during active development.
    "fixme",
    # duplicate-code: pytest fixtures/tests are inherently boilerplate-heavy
    # (env setup, cert-writing loops, assert chains); the similarity checker
    # false-positives here even across unrelated files (and, in at least one
    # observed case, a file against itself), rather than flagging real
    # copy-pasted logic worth extracting.
    "duplicate-code",
    # broad-exception-caught: BaseCheck.run() must never raise (the guide's
    # own rule — collector/checks/__init__.py) so every check's run() method
    # deliberately catches Exception broadly and returns
    # CheckResult(ok=False, error=...) instead of propagating.
    "broad-exception-caught",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
# Collector checks may need more arguments than pylint's default of 5.
max-args = 8

[tool.pylint.basic]
# PEP 695 generic type parameters (e.g. `def f[**P, R](...)`, Python 3.12+)
# are conventionally single uppercase letters; pylint doesn't yet recognize
# the new syntax and flags them as non-snake_case variable names.
good-names = ["i", "j", "k", "ex", "Run", "_", "P", "R", "T", "K", "V"]
