version: 2

updates:

  # ───────────────────────────────────────────────────────────────────────────
  # pip — collector/requirements.txt + requirements-dev.txt
  # The only active Python stack. Grouped to produce a single PR per week.
  # Major bumps are left open for manual review (they often need compatibility
  # fixes — e.g. pytest-asyncio requires manual version alignment with pytest).
  # ───────────────────────────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /collector
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "deps(pip)"
    groups:
      pip-patch-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ───────────────────────────────────────────────────────────────────────────
  # GitHub Actions — .github/workflows/
  # Pins floating @vN tags to immutable commit SHAs.
  # Major bumps allowed: v3→v4→v5 for actions are routine and safe.
  # ───────────────────────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-all:
        applies-to: version-updates
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
