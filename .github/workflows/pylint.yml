name: pylint

# Static analysis with pylint for the SENTINEL v2 collector.

on:
  push:
    branches: [main]
    paths:
      - "collector/**"
      - ".github/workflows/pylint.yml"
  pull_request:
    paths:
      - "collector/**"
      - ".github/workflows/pylint.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pylint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Install pylint
        run: pip install pylint

      - name: Run pylint
        run: pylint $(git ls-files '*.py')
