name: pylint

# Static analysis with pylint for the SENTINEL v2 collector.

on:
  push:
    branches: [main]
    paths:
      - "collector/**"
      - ".github/workflows/pylint.yml"
  pull_request:
    paths:
      - "collector/**"
      - ".github/workflows/pylint.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pylint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements-dev.txt

      - name: Install dev dependencies (includes pylint)
        run: pip install -r requirements-dev.txt

      - name: Run pylint (collector package + tests)
        # Scope explicitly to the collector package and its tests.
        # Do NOT use `git ls-files '*.py'` from working-directory: collector —
        # git lists paths relative to the repo root so they resolve incorrectly
        # when the working directory is already inside the repo.
        run: pylint collector tests
