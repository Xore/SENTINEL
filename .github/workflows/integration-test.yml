name: phase-1 integration

on:
  push:
    branches: [main]
    paths:
      - "backend/api/**"
      - "backend/ingest/**"
      - "collector/**"
      - "deploy/hub/**"
      - ".github/workflows/integration-test.yml"
  pull_request:
    paths:
      - "backend/api/**"
      - "backend/ingest/**"
      - "collector/**"
      - "deploy/hub/**"
      - ".github/workflows/integration-test.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: phase-1-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  heartbeat:
    name: collector heartbeat reaches VictoriaMetrics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: deploy/hub/docker-compose.dev.yml
      COLLECTOR_ID: dev-node-1
      SITE_ID: site-a
      BACKEND__URL: https://localhost:4317
      BACKEND__ENROLL_URL: https://localhost:8443/api/pki/enroll
      BACKEND__BOOTSTRAP_TOKEN: dev-only-bootstrap-token
      SENTINEL_DEV_API_JWT_SECRET: dev-only-api-jwt-secret-0123456789
      HTTP__TARGETS: >-
        [{"target_id":"ci-http","url":"http://127.0.0.1:18080/health?token=c2-03-storage-secret"}]
      HTTP__INTERVAL_S: "1"
      HTTP__TIMEOUT_S: "2"
      OTEL_METRIC_EXPORT_INTERVAL: "2000"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install collector
        working-directory: collector
        run: pip install -r requirements.txt

      - name: Start disposable production-path hub
        run: docker compose up -d --build

      - name: Wait for ingest and VictoriaMetrics
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --insecure \
                https://localhost:8443/readyz >/dev/null \
              && curl --fail --silent --show-error \
                http://localhost:8428/-/healthy >/dev/null \
              && curl --fail --silent --show-error \
                http://localhost:8080/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps --all
          docker compose logs --no-color
          exit 1

      - name: Copy disposable enrollment CA
        shell: bash
        run: |
          set -euo pipefail
          docker compose cp pki-init:/pki/ca.crt \
            "${RUNNER_TEMP}/sentinel-dev-ca.crt"

      - name: Enroll collector and assert stored heartbeat and HTTP probe
        shell: bash
        env:
          SSL_CERT_FILE: ${{ runner.temp }}/sentinel-dev-ca.crt
          BACKEND__PKI_DIR: ${{ runner.temp }}/dev-node-1-pki
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          collector_log="${RUNNER_TEMP}/collector.log"
          heartbeat_result="${RUNNER_TEMP}/vm-heartbeat-query.json"
          probe_result="${RUNNER_TEMP}/vm-http-query.json"
          target_log="${RUNNER_TEMP}/http-target.log"
          target_url='http://127.0.0.1:18080/health?token=c2-03-storage-secret'

          printf 'ok\n' >"${RUNNER_TEMP}/health"
          python -m http.server 18080 --bind 127.0.0.1 \
            --directory "${RUNNER_TEMP}" >"${target_log}" 2>&1 &
          target_pid=$!

          python -c "import collector; print(collector.__file__)"
          python -m collector >"${collector_log}" 2>&1 &
          collector_pid=$!

          stop_processes() {
            if kill -0 "${collector_pid}" 2>/dev/null; then
              kill -TERM "${collector_pid}" 2>/dev/null || true
              wait "${collector_pid}" 2>/dev/null || true
            fi
            if kill -0 "${target_pid}" 2>/dev/null; then
              kill -TERM "${target_pid}" 2>/dev/null || true
              wait "${target_pid}" 2>/dev/null || true
            fi
          }
          trap stop_processes EXIT

          for attempt in $(seq 1 90); do
            if ! kill -0 "${collector_pid}" 2>/dev/null; then
              echo "collector exited before exporting required metrics"
              cat "${collector_log}"
              exit 1
            fi

            if curl --fail --silent --show-error --get \
                --data-urlencode \
                'query=sentinel_collector_heartbeat_total{collector_id="dev-node-1",site_id="site-a"}' \
                --output "${heartbeat_result}" \
                http://localhost:8428/api/v1/query \
              && curl --fail --silent --show-error --get \
                --data-urlencode \
                'query=sentinel_collector_http_response_seconds_count{collector_id="dev-node-1",site_id="site-a",target_id="ci-http",state="ok"}' \
                --output "${probe_result}" \
                http://localhost:8428/api/v1/query \
              && python - "${heartbeat_result}" "${probe_result}" "${target_url}" <<'PY'
          import json
          import sys

          heartbeat = json.load(open(sys.argv[1], encoding="utf-8"))
          heartbeat_results = heartbeat.get("data", {}).get("result", [])
          if heartbeat.get("status") != "success" or not heartbeat_results:
              raise SystemExit(1)
          heartbeat_metric = heartbeat_results[0].get("metric", {})
          if heartbeat_metric.get("collector_id") != "dev-node-1":
              raise SystemExit(1)
          if heartbeat_metric.get("site_id") != "site-a":
              raise SystemExit(1)

          probe = json.load(open(sys.argv[2], encoding="utf-8"))
          probe_results = probe.get("data", {}).get("result", [])
          if probe.get("status") != "success" or len(probe_results) != 1:
              raise SystemExit(1)
          metric = probe_results[0].get("metric", {})
          expected = {
              "collector_id": "dev-node-1",
              "site_id": "site-a",
              "target_id": "ci-http",
              "state": "ok",
          }
          if any(metric.get(key) != value for key, value in expected.items()):
              raise SystemExit(1)
          if {"target", "url", "http.url"} & metric.keys():
              raise SystemExit(f"raw target label reached storage: {metric}")
          rendered = json.dumps(probe, sort_keys=True)
          if "c2-03-storage-secret" in rendered or sys.argv[3] in rendered:
              raise SystemExit("raw HTTP target reached storage")
          PY
            then
              if grep --fixed-strings --quiet 'c2-03-storage-secret' "${collector_log}" \
                || grep --fixed-strings --quiet "${target_url}" "${collector_log}"; then
                echo "raw HTTP target leaked into collector logs"
                cat "${collector_log}"
                exit 1
              fi
              echo "canonical heartbeat and HTTP probe reached VictoriaMetrics"
              cat "${heartbeat_result}"
              cat "${probe_result}"
              exit 0
            fi
            sleep 2
          done

          echo "required metric queries did not become ready before the deadline"
          cat "${collector_log}"
          cat "${target_log}"
          test ! -f "${heartbeat_result}" || cat "${heartbeat_result}"
          test ! -f "${probe_result}" || cat "${probe_result}"
          exit 1

      - name: Assert authenticated site-scoped last_seen API
        shell: bash
        run: |
          set -euo pipefail

          mint_token() {
            local site_id="$1"
            python - "${site_id}" <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import sys
          import time

          def encode(value):
              raw = json.dumps(value, separators=(",", ":")).encode()
              return base64.urlsafe_b64encode(raw).rstrip(b"=").decode()

          now = int(time.time())
          header = encode({"alg": "HS256", "typ": "JWT"})
          payload = encode({
              "sub": "dev-viewer",
              "iss": "sentinel-site",
              "aud": ["sentinel-site-api"],
              "iat": now,
              "nbf": now - 5,
              "exp": now + 300,
              "role": "viewer",
              "site_ids": [sys.argv[1]],
          })
          message = f"{header}.{payload}".encode()
          signature = hmac.new(
              os.environ["SENTINEL_DEV_API_JWT_SECRET"].encode(),
              message,
              hashlib.sha256,
          ).digest()
          print(f"{header}.{payload}." + base64.urlsafe_b64encode(signature).rstrip(b"=").decode())
          PY
          }

          authorized_token="$(mint_token site-a)"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${authorized_token}" \
            -o "${RUNNER_TEMP}/api-collectors.json" \
            http://localhost:8080/api/v1/collectors
          python - "${RUNNER_TEMP}/api-collectors.json" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          matches = [
              row for row in payload.get("data", [])
              if row.get("site_id") == "site-a"
              and row.get("collector_id") == "dev-node-1"
              and row.get("last_seen")
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one collector with last_seen, got: {payload}")
          PY

          range_start="$(date -u -d '5 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')"
          range_end="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          curl --fail --silent --show-error --get \
            -H "Authorization: Bearer ${authorized_token}" \
            --data-urlencode "metric=sentinel_collector_heartbeat_total" \
            --data-urlencode "site_id=site-a" \
            --data-urlencode "collector_id=dev-node-1" \
            --data-urlencode "start=${range_start}" \
            --data-urlencode "end=${range_end}" \
            --data-urlencode "step=30" \
            -o "${RUNNER_TEMP}/api-metrics-range.json" \
            http://localhost:8080/api/v1/metrics/range
          python - "${RUNNER_TEMP}/api-metrics-range.json" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          results = payload.get("data", {}).get("result", [])
          matches = [
              series for series in results
              if series.get("metric", {}).get("site_id") == "site-a"
              and series.get("metric", {}).get("collector_id") == "dev-node-1"
              and series.get("values")
          ]
          if payload.get("data", {}).get("result_type") != "matrix" or len(matches) != 1:
              raise SystemExit(f"expected one site-scoped matrix, got: {payload}")
          PY

          curl --fail --silent --show-error --get \
            -H "Authorization: Bearer ${authorized_token}" \
            --data-urlencode "metric=sentinel_collector_http_response_seconds_count" \
            --data-urlencode "site_id=site-a" \
            --data-urlencode "collector_id=dev-node-1" \
            --data-urlencode "start=${range_start}" \
            --data-urlencode "end=${range_end}" \
            --data-urlencode "step=30" \
            -o "${RUNNER_TEMP}/api-http-metrics-range.json" \
            http://localhost:8080/api/v1/metrics/range
          python - "${RUNNER_TEMP}/api-http-metrics-range.json" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          results = payload.get("data", {}).get("result", [])
          matches = []
          for series in results:
              metric = series.get("metric", {})
              if (
                  metric.get("site_id") == "site-a"
                  and metric.get("collector_id") == "dev-node-1"
                  and metric.get("target_id") == "ci-http"
                  and metric.get("state") == "ok"
                  and series.get("values")
              ):
                  if {"target", "url", "http.url"} & metric.keys():
                      raise SystemExit(f"raw target label reached API: {metric}")
                  matches.append(series)
          rendered = json.dumps(payload, sort_keys=True)
          if "c2-03-storage-secret" in rendered or "http://127.0.0.1:18080/" in rendered:
              raise SystemExit("raw HTTP target reached API response")
          if payload.get("data", {}).get("result_type") != "matrix" or len(matches) != 1:
              raise SystemExit(f"expected one bounded HTTP metric matrix, got: {payload}")
          PY

          unauthorized_token="$(mint_token site-b)"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${unauthorized_token}" \
            -o "${RUNNER_TEMP}/api-unauthorized-site.json" \
            http://localhost:8080/api/v1/collectors
          python - "${RUNNER_TEMP}/api-unauthorized-site.json" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("data") != []:
              raise SystemExit(f"unauthorized site rows leaked: {payload}")
          PY

          unauthorized_status="$(curl --silent --show-error --get \
            -H "Authorization: Bearer ${unauthorized_token}" \
            --data-urlencode "metric=sentinel_collector_heartbeat_total" \
            --data-urlencode "site_id=site-a" \
            --data-urlencode "start=${range_start}" \
            --data-urlencode "end=${range_end}" \
            --data-urlencode "step=30" \
            -o "${RUNNER_TEMP}/api-unauthorized-metrics.json" \
            --write-out '%{http_code}' \
            http://localhost:8080/api/v1/metrics/range)"
          test "${unauthorized_status}" = "404"
          python - "${RUNNER_TEMP}/api-unauthorized-metrics.json" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("error", {}).get("code") != "not_found":
              raise SystemExit(f"unexpected unauthorized metrics response: {payload}")
          PY

      - name: Diagnostics and cleanup
        if: always()
        shell: bash
        run: |
          test ! -f "${RUNNER_TEMP}/collector.log" \
            || cat "${RUNNER_TEMP}/collector.log"
          docker compose ps --all || true
          docker compose logs --no-color || true
          docker compose down --volumes --remove-orphans || true
