name: phase-1 integration

on:
  push:
    branches: [main]
    paths:
      - "backend/api/**"
      - "backend/ingest/**"
      - "collector/**"
      - "deploy/hub/**"
      - ".github/workflows/integration-test.yml"
  pull_request:
    paths:
      - "backend/api/**"
      - "backend/ingest/**"
      - "collector/**"
      - "deploy/hub/**"
      - ".github/workflows/integration-test.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: phase-1-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  heartbeat:
    name: collector heartbeat reaches VictoriaMetrics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: deploy/hub/docker-compose.dev.yml
      COLLECTOR_ID: dev-node-1
      SITE_ID: site-a
      BACKEND__URL: https://localhost:4317
      BACKEND__ENROLL_URL: https://localhost:8443/api/pki/enroll
      BACKEND__BOOTSTRAP_TOKEN: dev-only-bootstrap-token
      SENTINEL_DEV_API_JWT_SECRET: dev-only-api-jwt-secret-0123456789
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install collector
        working-directory: collector
        run: pip install -r requirements.txt

      - name: Start disposable production-path hub
        run: docker compose up -d --build

      - name: Wait for ingest and VictoriaMetrics
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --insecure \
                https://localhost:8443/readyz >/dev/null \
              && curl --fail --silent --show-error \
                http://localhost:8428/-/healthy >/dev/null \
              && curl --fail --silent --show-error \
                http://localhost:8080/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps --all
          docker compose logs --no-color
          exit 1

      - name: Copy disposable enrollment CA
        shell: bash
        run: |
          set -euo pipefail
          docker compose cp pki-init:/pki/ca.crt \
            "${RUNNER_TEMP}/sentinel-dev-ca.crt"

      - name: Enroll collector and assert stored heartbeat
        shell: bash
        env:
          SSL_CERT_FILE: ${{ runner.temp }}/sentinel-dev-ca.crt
          BACKEND__PKI_DIR: ${{ runner.temp }}/dev-node-1-pki
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          collector_log="${RUNNER_TEMP}/collector.log"
          query_result="${RUNNER_TEMP}/vm-query.json"

          python -c "import collector; print(collector.__file__)"
          python -m collector >"${collector_log}" 2>&1 &
          collector_pid=$!

          stop_collector() {
            if kill -0 "${collector_pid}" 2>/dev/null; then
              kill -TERM "${collector_pid}" 2>/dev/null || true
              wait "${collector_pid}" 2>/dev/null || true
            fi
          }
          trap stop_collector EXIT

          for attempt in $(seq 1 90); do
            if ! kill -0 "${collector_pid}" 2>/dev/null; then
              echo "collector exited before exporting a heartbeat"
              cat "${collector_log}"
              exit 1
            fi

            if curl --fail --silent --show-error --get \
                --data-urlencode \
                'query=sentinel_collector_heartbeat_total{collector_id="dev-node-1",site_id="site-a"}' \
                --output "${query_result}" \
                http://localhost:8428/api/v1/query \
              && python - "${query_result}" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          results = payload.get("data", {}).get("result", [])
          if payload.get("status") != "success" or not results:
              raise SystemExit(1)
          metric = results[0].get("metric", {})
          if metric.get("collector_id") != "dev-node-1":
              raise SystemExit(1)
          if metric.get("site_id") != "site-a":
              raise SystemExit(1)
          PY
            then
              echo "canonical heartbeat reached VictoriaMetrics with expected identity"
              cat "${query_result}"
              exit 0
            fi
            sleep 2
          done

          echo "heartbeat query did not become ready before the deadline"
          cat "${collector_log}"
          test ! -f "${query_result}" || cat "${query_result}"
          exit 1

      - name: Assert authenticated site-scoped last_seen API
        shell: bash
        run: |
          set -euo pipefail

          mint_token() {
            local site_id="$1"
            python - "${site_id}" <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import sys
          import time

          def encode(value):
              raw = json.dumps(value, separators=(",", ":")).encode()
              return base64.urlsafe_b64encode(raw).rstrip(b"=").decode()

          now = int(time.time())
          header = encode({"alg": "HS256", "typ": "JWT"})
          payload = encode({
              "sub": "dev-viewer",
              "iss": "sentinel-site",
              "aud": ["sentinel-site-api"],
              "iat": now,
              "nbf": now - 5,
              "exp": now + 300,
              "role": "viewer",
              "site_ids": [sys.argv[1]],
          })
          message = f"{header}.{payload}".encode()
          signature = hmac.new(
              os.environ["SENTINEL_DEV_API_JWT_SECRET"].encode(),
              message,
              hashlib.sha256,
          ).digest()
          print(f"{header}.{payload}." + base64.urlsafe_b64encode(signature).rstrip(b"=").decode())
          PY
          }

          authorized_token="$(mint_token site-a)"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${authorized_token}" \
            -o "${RUNNER_TEMP}/api-collectors.json" \
            http://localhost:8080/api/v1/collectors
          python - "${RUNNER_TEMP}/api-collectors.json" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          matches = [
              row for row in payload.get("data", [])
              if row.get("site_id") == "site-a"
              and row.get("collector_id") == "dev-node-1"
              and row.get("last_seen")
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one collector with last_seen, got: {payload}")
          PY

          unauthorized_token="$(mint_token site-b)"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${unauthorized_token}" \
            -o "${RUNNER_TEMP}/api-unauthorized-site.json" \
            http://localhost:8080/api/v1/collectors
          python - "${RUNNER_TEMP}/api-unauthorized-site.json" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("data") != []:
              raise SystemExit(f"unauthorized site rows leaked: {payload}")
          PY

      - name: Diagnostics and cleanup
        if: always()
        shell: bash
        run: |
          test ! -f "${RUNNER_TEMP}/collector.log" \
            || cat "${RUNNER_TEMP}/collector.log"
          docker compose ps --all || true
          docker compose logs --no-color || true
          docker compose down --volumes --remove-orphans || true
