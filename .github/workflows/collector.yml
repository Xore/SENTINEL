name: collector

# CI for the SENTINEL v2 collector (Python 3.12 asyncio agent).
# The frozen v1 stack (Go collector, Flask dashboard, monitor/) lives on the
# release/v1.0 branch and is not built here.

on:
  push:
    branches: [main]
    paths:
      - "collector/**"
      - ".github/workflows/collector.yml"
  pull_request:
    paths:
      - "collector/**"
      - ".github/workflows/collector.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: collector/requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy .

      - name: Static analysis (pylint)
        run: pylint collector tests

      - name: Tests (pytest)
        run: pytest -q
