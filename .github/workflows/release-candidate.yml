name: Release Candidate

# Runs on every push to main.
# If ALL gates pass (Pylint >= 8.0, Go vet+build+test, pytest) a pre-release
# tag  rc-YYYY.MM.DD-<short-sha>  is created automatically, with compiled
# Go binaries attached as release assets.
#
# Artifact attestation (actions/attest-build-provenance) generates a
# Sigstore-backed provenance bundle for every binary and the SHA256SUMS file.
# Consumers can verify offline with:
#   gh attestation verify <binary> --repo Xore/analyseLaptop
# Or verify checksums without the gh CLI:
#   sha256sum -c SHA256SUMS
#
# Action version strategy:
#   Floating major tags (@v4, @v5) are maintained by GitHub to always point
#   at the latest Node 24-compatible patch release.
#   attest-build-provenance@v4 vendors fully Node 24-migrated internals.

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - '.gitattributes'

concurrency:
  group: rc-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # -------------------------------------------------------
  # Gate 1 - Pylint
  # -------------------------------------------------------
  pylint:
    name: Pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: monitor/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r monitor/requirements.txt pylint

      - name: Pylint
        run: |
          pylint monitor/ \
            --fail-under=8.0 \
            --disable=C0114,C0115,C0116 \
            --max-line-length=120

  # -------------------------------------------------------
  # Gate 2 - Go vet + cross-compile + test
  # -------------------------------------------------------
  go:
    name: Go Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # go.mod always exists; go.sum may not be present before
          # 'go mod download' runs, which caused cache-restore failures.
          cache-dependency-path: collector/go.mod

      - run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build linux/amd64
        run: GOOS=linux   GOARCH=amd64 go build -v -o ../dist/collector-linux-amd64    ./...

      - name: Build linux/arm64
        run: GOOS=linux   GOARCH=arm64 go build -v -o ../dist/collector-linux-arm64    ./...

      - name: Build windows/amd64
        run: GOOS=windows GOARCH=amd64 go build -v -o ../dist/collector-windows-amd64.exe ./...

      - name: Build windows/arm64
        run: GOOS=windows GOARCH=arm64 go build -v -o ../dist/collector-windows-arm64.exe ./...

      - name: Test
        run: go test -v -race -timeout 60s ./...

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-binaries
          path: dist/
          retention-days: 1

  # -------------------------------------------------------
  # Gate 3 - pytest (tests/)
  # -------------------------------------------------------
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            dashboard/requirements.txt
            monitor/requirements.txt
            tests/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r dashboard/requirements.txt
          pip install -r monitor/requirements.txt
          pip install -r tests/requirements.txt

      - name: Run pytest
        run: |
          pytest tests/ \
            --ignore=tests/test_lab_access_sh.sh \
            --ignore=tests/test_setup_sh.sh \
            -v --tb=short

      - name: Run shell tests
        run: |
          bash tests/test_setup_sh.sh
          bash tests/test_lab_access_sh.sh

  # -------------------------------------------------------
  # Release Candidate - only runs when ALL gates pass
  # -------------------------------------------------------
  release-candidate:
    name: Create RC Tag & Release
    needs: [pylint, go, pytest]
    runs-on: ubuntu-latest

    # id-token   : required by Sigstore OIDC to mint the short-lived signing cert
    # attestations: required by actions/attest-build-provenance to write the bundle
    # contents   : required to push the tag and create the GitHub release
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute RC tag
        id: tag
        run: |
          DATE=$(date -u '+%Y.%m.%d')
          SHORT=${GITHUB_SHA::7}
          echo "name=rc-${DATE}-${SHORT}" >> $GITHUB_OUTPUT

      - name: Download Go binaries
        uses: actions/download-artifact@v4
        with:
          name: go-binaries
          path: dist/

      # ------------------------------------------------------------------
      # Generate SHA256SUMS for all binaries.
      # This allows users to verify downloads without needing the gh CLI:
      #   sha256sum -c SHA256SUMS
      # ------------------------------------------------------------------
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum \
            collector-linux-amd64 \
            collector-linux-arm64 \
            collector-windows-amd64.exe \
            collector-windows-arm64.exe \
            > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      # ------------------------------------------------------------------
      # Artifact attestation - Sigstore/OIDC, no GPG key required.
      # @v4 vendors fully Node 24-migrated internal sub-actions.
      # Each binary and SHA256SUMS gets a SLSA provenance bundle uploaded
      # to the repo's attestation store (Actions -> Attestations).
      # Verify with: gh attestation verify <file> --repo Xore/analyseLaptop
      # ------------------------------------------------------------------
      - name: Attest linux/amd64
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/collector-linux-amd64

      - name: Attest linux/arm64
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/collector-linux-arm64

      - name: Attest windows/amd64
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/collector-windows-amd64.exe

      - name: Attest windows/arm64
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/collector-windows-arm64.exe

      - name: Attest SHA256SUMS
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/SHA256SUMS

      - name: Push RC tag (annotated)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.tag.outputs.name }} \
            -m "RC ${{ steps.tag.outputs.name }} - all CI gates passed"
          git push origin ${{ steps.tag.outputs.name }}

      - name: Write release notes
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          Automated release candidate - all CI gates passed.

          **Commit:** ${{ github.sha }}
          **Triggered by:** ${{ github.actor }}

          ### Gates
          - Pylint >= 8.0
          - Go vet + build (linux/amd64, linux/arm64, windows/amd64, windows/arm64)
          - pytest (tests/)

          ### Binaries
          | File | OS | Arch |
          |------|----|------|
          | `collector-linux-amd64` | Linux | x86-64 |
          | `collector-linux-arm64` | Linux | ARM64 (Raspberry Pi 4/5) |
          | `collector-windows-amd64.exe` | Windows | x86-64 |
          | `collector-windows-arm64.exe` | Windows | ARM64 |

          ### Verification
          **Option 1 - Sigstore attestation** (cryptographic provenance, requires `gh` CLI):
          ```
          gh attestation verify <binary> --repo Xore/analyseLaptop
          ```
          **Option 2 - SHA256 checksum** (no extra tooling required):
          ```
          sha256sum -c SHA256SUMS
          ```
          The `SHA256SUMS` file itself is also attested via Sigstore.
          EOF

      - name: Create GitHub pre-release with binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.tag.outputs.name }} \
            --prerelease \
            --title "RC ${{ steps.tag.outputs.name }}" \
            --notes-file /tmp/release-notes.md \
            dist/collector-linux-amd64 \
            dist/collector-linux-arm64 \
            dist/collector-windows-amd64.exe \
            dist/collector-windows-arm64.exe \
            dist/SHA256SUMS
