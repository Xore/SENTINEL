name: Release Candidate

# Runs on every push to main.
# If ALL gates pass (Pylint >= 8.0, Go vet+build+test, pytest) a pre-release
# tag  rc-YYYY.MM.DD-<short-sha>  is created automatically.

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - '.gitattributes'

concurrency:
  group: rc-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # -------------------------------------------------------
  # Gate 1 - Pylint
  # -------------------------------------------------------
  pylint:
    name: Pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: monitor/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r monitor/requirements.txt pylint

      - name: Pylint
        run: |
          pylint monitor/ \
            --fail-under=8.0 \
            --disable=C0114,C0115,C0116 \
            --max-line-length=120

  # -------------------------------------------------------
  # Gate 2 - Go vet + cross-compile + test
  # -------------------------------------------------------
  go:
    name: Go Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: collector/go.sum

      - run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build linux/amd64
        run: GOOS=linux   GOARCH=amd64 go build -v ./...

      - name: Build linux/arm64
        run: GOOS=linux   GOARCH=arm64 go build -v ./...

      - name: Build windows/amd64
        run: GOOS=windows GOARCH=amd64 go build -v ./...

      - name: Test
        run: go test -v -race -timeout 60s ./...

  # -------------------------------------------------------
  # Gate 3 - pytest (tests/)
  # -------------------------------------------------------
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            dashboard/requirements.txt
            monitor/requirements.txt
            tests/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r dashboard/requirements.txt
          pip install -r monitor/requirements.txt
          pip install -r tests/requirements.txt

      - name: Run pytest
        run: |
          pytest tests/ \
            --ignore=tests/test_lab_access_sh.sh \
            --ignore=tests/test_setup_sh.sh \
            -v --tb=short

      - name: Run shell tests
        run: |
          bash tests/test_setup_sh.sh
          bash tests/test_lab_access_sh.sh

  # -------------------------------------------------------
  # Release Candidate - only runs when ALL gates pass
  # -------------------------------------------------------
  release-candidate:
    name: Create RC Tag
    needs: [pylint, go, pytest]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute RC tag
        id: tag
        run: |
          DATE=$(date -u '+%Y.%m.%d')
          SHORT=${GITHUB_SHA::7}
          echo "name=rc-${DATE}-${SHORT}" >> $GITHUB_OUTPUT

      - name: Push RC tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.tag.outputs.name }}
          git push origin ${{ steps.tag.outputs.name }}

      - name: Write release notes
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          Automated release candidate - all CI gates passed.

          **Commit:** ${{ github.sha }}
          **Triggered by:** ${{ github.actor }}

          ### Gates
          - Pylint >= 8.0
          - Go vet + build (linux/amd64, linux/arm64, windows/amd64)
          - pytest (tests/)
          EOF

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.tag.outputs.name }} \
            --prerelease \
            --title "RC ${{ steps.tag.outputs.name }}" \
            --notes-file /tmp/release-notes.md
