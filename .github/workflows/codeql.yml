# CodeQL Advanced scanning.
# Runs on push/PR to main and weekly on Sunday.
#
# NOTE: This repo does not have GitHub Advanced Security (GHAS) enabled.
# The job is kept so it runs automatically if GHAS is ever enabled, but
# continue-on-error: true ensures it never blocks a PR merge.

name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '31 20 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Never block PRs — GHAS is not enabled on this repo.
    continue-on-error: true

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: go
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # For compiled languages, install the requested toolchain before CodeQL
      # initializes its tracing wrapper. Installing Go after init replaces the
      # wrapper and produces a "no source code seen during build" failure.
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/ingest/go.mod
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Go backend
        if: matrix.language == 'go'
        working-directory: backend/ingest
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
