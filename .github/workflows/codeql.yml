name: CodeQL Advanced

# Advanced setup — default setup must be DISABLED in repo Settings
# (Settings → Code security → Code scanning → Default setup → Disable)
# before SARIF uploads from this workflow will be accepted.
#
# Covers: actions, go (collector/), python (monitor/, dashboard/)
# Query suite: security-extended (adds CWE-78, CWE-295, CWE-312 coverage)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '34 1 * * 3'   # Wednesday 01:34 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: python
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: collector/go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths:
              - collector
              - monitor
              - dashboard
              - .github/workflows
            paths-ignore:
              - docs
              - tests
              - scripts

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
