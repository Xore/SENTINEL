name: CodeQL

# Runs on every push to main, every PR targeting main, and weekly on Monday
# to catch newly-published CVEs even when the code hasn't changed.
#
# NOTE: GitHub's default CodeQL setup must be DISABLED in repo Settings
# (Settings → Code security → Code scanning → Default setup → Disable)
# before results from this advanced workflow can be uploaded.
#
# Languages: go (collector/) and python (monitor/, dashboard/).
# security-extended query suite adds extra CWE coverage relevant to the
# findings in docs/security/code-scanning-remediation.md:
#   CWE-78  (command injection)     - Finding 4
#   CWE-295 (TLS verification)      - Finding 2
#   CWE-312 (cleartext credentials) - Finding 3

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 4 * * 1'   # every Monday at 04:00 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      security-events: write   # upload SARIF results to the Security tab
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: python
            build-mode: none      # Python is interpreted; no build step needed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (for autobuild)
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: collector/go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # security-extended suite adds ~50 extra queries on top of the
          # default suite, covering the CWEs identified in the remediation doc.
          queries: security-extended
          config: |
            paths:
              - collector
              - monitor
              - dashboard
            paths-ignore:
              - docs
              - tests
              - scripts

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
