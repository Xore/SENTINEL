# Dev-only OTLP/gRPC receiver terminating collector mTLS, forwarding metrics
# to VictoriaMetrics via Prometheus remote-write. Stands in for the future
# Go ingest service (docs/architecture/ARCHITECTURE-V2.md) for the Phase 1
# integration test — not the production ingest path.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        tls:
          cert_file: /pki/otel-collector.crt
          key_file: /pki/otel-collector.key
          client_ca_file: /pki/ca.crt

processors:
  batch: {}

exporters:
  prometheus_remote_write:
    endpoint: "http://victoriametrics:8428/api/v1/write"
    tls:
      insecure: true
    # Without this, only job/instance (from service.name/service.instance.id)
    # reach VictoriaMetrics as labels — the collector_id/site_id resource
    # attributes set in collector/transport/otlp.py are dropped.
    resource_to_telemetry_conversion:
      enabled: true
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus_remote_write, debug]
