# Dev-only Phase 1 integration stack. It runs the production Go migration,
# enrollment, mTLS identity, and OTLP ingest code against disposable services.

services:
  pki-init:
    build: ./stub-pki
    command:
      - python3
      - -c
      - |
        import app
        key, cert = app._load_or_create_ca()
        app._ensure_otel_server_cert(key, cert)
    volumes:
      - pki_data:/pki
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analyselaptop}
      POSTGRES_USER: ${POSTGRES_USER:-analyselaptop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-not-a-real-secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analyselaptop}"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    build:
      context: ../../backend/ingest
    command: ["/usr/local/bin/migrate"]
    environment:
      SENTINEL_DATABASE_URL: postgres://${POSTGRES_USER:-analyselaptop}:${POSTGRES_PASSWORD:-dev-only-not-a-real-secret}@postgres:5432/${POSTGRES_DB:-analyselaptop}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed-dev:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-dev-only-not-a-real-secret}
    command:
      - psql
      - --set=ON_ERROR_STOP=1
      - --host=postgres
      - --username=${POSTGRES_USER:-analyselaptop}
      - --dbname=${POSTGRES_DB:-analyselaptop}
      - --file=/seed/seed-dev.sql
    volumes:
      - ./postgres/seed-dev.sql:/seed/seed-dev.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.148.0
    volumes:
      - vm_data:/victoria-metrics-data
    ports:
      - "127.0.0.1:8428:8428"

  ingest:
    build:
      context: ../../backend/ingest
    environment:
      SENTINEL_DATABASE_URL: postgres://${POSTGRES_USER:-analyselaptop}:${POSTGRES_PASSWORD:-dev-only-not-a-real-secret}@postgres:5432/${POSTGRES_DB:-analyselaptop}?sslmode=disable
      SENTINEL_INGEST_GRPC_ADDRESS: :4317
      SENTINEL_INGEST_HTTP_ADDRESS: :8443
      SENTINEL_INGEST_TLS_CERT_FILE: /pki/otel-collector.crt
      SENTINEL_INGEST_TLS_KEY_FILE: /pki/otel-collector.key
      SENTINEL_INGEST_CLIENT_CA_FILE: /pki/ca.crt
      SENTINEL_COLLECTOR_CA_CERT_FILE: /pki/ca.crt
      SENTINEL_COLLECTOR_CA_KEY_FILE: /pki/ca.key
      SENTINEL_INGEST_VM_OTLP_URL: http://victoriametrics:8428/opentelemetry/v1/metrics
    volumes:
      - pki_data:/pki:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:8443:8443"
    depends_on:
      pki-init:
        condition: service_completed_successfully
      seed-dev:
        condition: service_completed_successfully
      victoriametrics:
        condition: service_started
    healthcheck:
      test:
        ["CMD", "wget", "--no-check-certificate", "-q", "-O", "-", "https://localhost:8443/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pki_data:
  vm_data:
  pg_data:
